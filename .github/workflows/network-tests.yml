name: connected-client
on:
  push:
    branches: [main, feat/connected-client]
  pull_request:
permissions:
  contents: read
concurrency:
  group: connected-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source only (no credentials or working files)
        run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected-client-source-${{ github.sha }}
          path: source.zip
          retention-days: 7
          if-no-files-found: error
