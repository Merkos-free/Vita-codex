name: source-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  ui-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: g++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/ui_model_test.cpp -o ui_model_test
      - run: ./ui_model_test
      - name: Archive tracked source only (no credentials or local files)
        run: |
          mkdir -p build/source-snapshot
          git archive --format=zip HEAD -o build/source-snapshot/source.zip
          git rev-parse HEAD > build/source-snapshot/commit.txt
          git rev-parse HEAD^{tree} > build/source-snapshot/tree.txt
          cd build/source-snapshot && sha256sum source.zip > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tracked-source-${{ github.sha }}
          path: build/source-snapshot/
          retention-days: 14
          if-no-files-found: error
# Host tests only. No real Codex account, model call, Vita cross-build or hardware test.
